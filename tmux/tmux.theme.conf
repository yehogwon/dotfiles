# Palette: DESIGN.md tokens; @theme picks light or dark (dark by default)
%if "#{==:#{@theme},light}"
%hidden BG_ALT="#eceef1"
%hidden TEXT="#1d2026"
%hidden TEXT_LIGHT="#5f656e"
%hidden TEXT_FAINT="#a0a5ad"
%hidden ACCENT="#2b4785"
%hidden ACCENT_INK="#2b4785"
%hidden ON_ACCENT="#f6f7f9"
%hidden OK="#365204"
%hidden BAD="#832721"
%hidden BAD_FILL="#832721"
%hidden ON_BAD="#f6f7f9"
%hidden RULE="#d8d9dc"
%hidden RULE_FIRM="#bebfc2"
%else
%hidden BG_ALT="#272727"
%hidden TEXT="#e0e0e0"
%hidden TEXT_LIGHT="#a6a6a6"
%hidden TEXT_FAINT="#6e6e6e"
%hidden ACCENT="#2b4785"
%hidden ACCENT_INK="#a9bce0"
%hidden ON_ACCENT="#f0f0f0"
%hidden OK="#9fbf5a"
%hidden BAD="#e0897f"
%hidden BAD_FILL="#e0897f"
%hidden ON_BAD="#1c1c1c"
%hidden RULE="#373737"
%hidden RULE_FIRM="#535353"
%endif

# Pane borders: hairlines; the active title is a navy badge, brick over ssh/su
set -g pane-border-status top
set -g pane-border-lines single
set -g pane-border-style "fg=$RULE_FIRM"
set -g pane-active-border-style "fg=#(#{@tmux_dir}/scripts/pane_border_color.sh '#{pane_current_command}' '$ACCENT_INK' '$BAD')"
set -g pane-border-format "#(#{@tmux_dir}/scripts/pane_title.sh '#{pane_tty}' '#{pane_current_command}' #{?pane_active,1,0} '#{b:pane_current_path}' '$ON_ACCENT' '$ACCENT' '$TEXT_LIGHT' '$BAD_FILL' '$ON_BAD')"

# Status bar
set -g status on
set -g status-interval 1
set -g status-position bottom
set -g status-justify absolute-centre
set -g status-style "fg=$TEXT_LIGHT,bg=default"
set -g status-left-length 120
set -g status-right-length 100

# Left: session@host · git
set -g status-left "\
 #[fg=$TEXT,bold]#S#[nobold#,fg=$TEXT_FAINT]@#[fg=$TEXT_LIGHT]#h#[fg=$TEXT_FAINT] · \
#[fg=$TEXT_LIGHT]#(#{@tmux_dir}/scripts/git_status.sh) "

# Right: [prefix|copy] · [mouse] · [sync] · [cwd] · [ob] · date · time
set -g status-right "\
#{?client_prefix,#[fg=$ON_ACCENT#,bg=$ACCENT#,bold] prefix #[default] #[fg=$TEXT_FAINT]· ,}\
#{?pane_in_mode,#[fg=$ON_ACCENT#,bg=$ACCENT#,bold] copy #[default] #[fg=$TEXT_FAINT]· ,}\
#{?mouse,#[fg=$TEXT_LIGHT]mouse #[fg=$TEXT_FAINT]· ,}\
#(tmux show-window-options -v synchronize-panes 2>/dev/null | grep -q on && printf '#[fg=$ACCENT_INK,bold]sync#[default] #[fg=$TEXT_FAINT]· ')\
#(tmux show-option -wqv @cwd_sync_panes 2>/dev/null | grep -q on && printf '#[fg=$ACCENT_INK,bold]cwd#[default] #[fg=$TEXT_FAINT]· ')\
#(#{@tmux_dir}/scripts/obsidian_status.sh '#{@vault_state_dir}' '$TEXT_LIGHT' '$OK' '$ACCENT_INK' '$TEXT_LIGHT' '$BAD' '$TEXT_FAINT')\
#[fg=$TEXT_LIGHT]%a %m/%d #[fg=$TEXT_FAINT]· #[fg=$TEXT]%H:%M "

# Window list: active in navy ink, the rest secondary gray
set -g window-status-separator "#[fg=$TEXT_FAINT]  ·  "
set -g window-status-format "#[fg=$TEXT_LIGHT]#I #W#{?window_zoomed_flag,#[fg=$ACCENT_INK] z,}"
set -g window-status-current-format "#[fg=$ACCENT_INK,bold]#I #W#{?window_zoomed_flag, z,}"
set -g window-status-activity-style "fg=$TEXT,nobold"
set -g window-status-bell-style "fg=$BAD,bold"

# Prompts, menus, popups and copy mode
set -g message-style "fg=$TEXT,bg=$BG_ALT"
set -g message-command-style "fg=$TEXT,bg=$BG_ALT"
set -g mode-style "fg=$ON_ACCENT,bg=$ACCENT"
set -g copy-mode-match-style "fg=$TEXT,bg=$BG_ALT"
set -g copy-mode-current-match-style "fg=$ON_ACCENT,bg=$ACCENT"
set -g copy-mode-mark-style "fg=$ON_BAD,bg=$BAD_FILL"
set -g menu-style "fg=$TEXT,bg=default"
set -g menu-selected-style "fg=$ON_ACCENT,bg=$ACCENT"
set -g menu-border-style "fg=$RULE_FIRM"
set -g menu-border-lines single
set -g popup-border-style "fg=$RULE_FIRM"
set -g popup-border-lines single
set -g display-panes-colour "$TEXT_FAINT"
set -g display-panes-active-colour "$ACCENT_INK"
set -g clock-mode-colour "$ACCENT_INK"
